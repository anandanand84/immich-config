# Hardware-accelerated transcoding — trimmed to the backends relevant for gpu-server.
# The nvenc service is pinned by UUID to the RTX 4070 Ti SUPER — the GTX 750 Ti cannot be used
# (driver 580 dropped 1st-gen Maxwell NVENC; onnxruntime CUDA needs SM >= 6.x). Beware VRAM contention with training jobs.
# Note: the 750 Ti only supports H.264 NVENC (no HEVC encode, no HEVC decode).

services:
  cpu: {}

  nvenc:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - GPU-2c1d6b33-427e-eb6d-5967-db230d92098f # RTX 4070 Ti SUPER (750 Ti unusable: SM 5.0 too old)
              capabilities:
                - gpu
                - compute
                - video
